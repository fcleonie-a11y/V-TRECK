<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Einstellungen · V-Track</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="settings"><div id="app-shell"></div><main class="page narrow"><header class="page-header"><div><p class="eyebrow">V-Track</p><h1>Einstellungen</h1></div></header><form id="settings-form" class="panel stack"><h2>Darstellung & Tracking</h2><label>Sprache<select name="language"><option value="de">Deutsch</option><option value="en">English</option></select></label><label>Zeitzone<select name="timezone"><option value="Europe/Vienna">Europe/Vienna</option><option value="Europe/Berlin">Europe/Berlin</option><option value="UTC">UTC</option></select></label><label class="toggle-row"><span><b>RR im Dashboard anzeigen</b><small>Rangfortschritt auf der Startseite</small></span><input type="checkbox" name="showRr" checked></label><label class="toggle-row"><span><b>Roulette-Ergebnisse speichern</b><small>Ziehungen in Firestore archivieren</small></span><input type="checkbox" name="saveRoulette" checked></label><div id="settings-message" class="message" hidden></div><button class="button primary" type="submit">Einstellungen speichern</button></form></main><script type="module" src="js/app.js"></script></body></html>
